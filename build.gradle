plugins {
    id 'java'
}

group   = 'eliteslayer'
version = '1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

sourceSets {
    main {
        java {
            srcDir 'src'
        }
    }
    test {
        java {
            srcDir 'test'
        }
    }
}

// When client.jar is absent, compile the DreamBot API stubs from test/ and
// place them on main's compile classpath so the main sources can build.
if (fileTree(dir: 'libs', include: ['*.jar']).isEmpty()) {
    sourceSets {
        stubs {
            java {
                srcDirs = ['test']
                include 'org/dreambot/**'
            }
        }
    }
    dependencies {
        compileOnly sourceSets.stubs.output
    }
    tasks.compileJava.dependsOn tasks.compileStubsJava
}

repositories {
    mavenCentral()
}

dependencies {
    // DreamBot client JAR — place client.jar in the libs/ folder.
    // Copy it from your DreamBot installation:
    //   Windows: C:\Users\<you>\DreamBot\BotData\client.jar
    //   macOS  : ~/DreamBot/BotData/client.jar
    //   Linux  : ~/DreamBot/BotData/client.jar
    compileOnly fileTree(dir: 'libs', include: ['*.jar'])

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly    'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
    useJUnitPlatform()
}

jar {
    archiveBaseName = 'EliteSlayer'
    archiveVersion  = '1.0'

    manifest {
        attributes(
            'Main-Class': 'eliteslayer.EliteSlayer'
        )
    }
}
